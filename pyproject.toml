[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "binance-bot"
version = "0.1.0"
description = "Crypto ML dataset and trading research pipeline"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "pyarrow",
    "pyyaml",
    "pandas-ta",
]

[project.optional-dependencies]
dev = [
    "pytest",
]
analysis = [
    "matplotlib",
    "scikit-learn",
    "scipy",
    "data-science-analysis-library==1.1",
]

[project.scripts]
build-master-dataset = "binance_bot.cli:build_master_main"
prepare-training-dataset = "binance_bot.cli:prepare_training_main"
run-eda-analysis = "binance_bot.cli:run_eda_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
