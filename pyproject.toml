[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "binance-bot"
version = "0.1.0"
description = "Crypto ML dataset and trading research pipeline"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "pyarrow",
    "pyyaml",
    "pandas-ta",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
build-master-dataset = "binance_bot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
